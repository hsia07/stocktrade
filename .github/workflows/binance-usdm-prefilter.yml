name: Binance USD-M Prefilter

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches:
      - master
    paths:
      - 'automation/binance_usdm_prefilter.py'
      - '.github/workflows/binance-usdm-prefilter.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full-market prefilter
        run: python automation/binance_usdm_prefilter.py
